name: CI

# Quality gates: app checks + Terraform checks. Runs on pull requests (with a
# Terraform plan posted to the PR for review) and is called by CD before every deploy.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  TF_VERSION: 1.16.5

jobs:
  lint:
    name: Lint (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check formatting
        run: npx -y prettier@2.8.8 --check "server/**/*.js" "client/app/**/*.js"

  audit:
    name: Dependency audit (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [client, server]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Report-only: the app pins old dependencies with known advisories.
      # Raise to a blocking gate once they are upgraded.
      - name: npm audit (report only)
        working-directory: ${{ matrix.service }}
        run: |
          npm audit --omit=dev --audit-level=critical > audit.txt || true
          {
            echo "### npm audit — ${{ matrix.service }}"
            echo '```'
            tail -n 5 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  api-test:
    name: Build & API integration test
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-only-password
      CLIENT_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the full stack (client, server, mongo)
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Frontend is served by nginx
        run: curl -fsS http://localhost:8080/ | grep -qi '<html'

      - name: Health endpoint reports the database connected
        run: curl -fsS http://localhost:8080/api/health | jq -e '.status == "ok" and .database == "connected"'

      - name: Public API endpoints return seeded data
        run: |
          curl -fsS http://localhost:8080/api/category/list | jq -e '.categories | length > 0'
          curl -fsS http://localhost:8080/api/brand/list | jq -e '.brands | length > 0'
          curl -fsS 'http://localhost:8080/api/product/list?sortOrder=%7B%22_id%22%3A-1%7D&rating=0&max=2500&min=1&category=all&brand=all&page=1&limit=5' \
            | jq -e '.products | length > 0'

      - name: Admin login returns a JWT
        run: |
          curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
            | jq -e '.success == true and (.token | startswith("Bearer ")) and .user.role == "ROLE ADMIN"'

      - name: Wrong password is rejected
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"wrong\"}")
          test "$code" = 400

      - name: Server and MongoDB ports are not published
        run: |
          if curl -s --max-time 3 http://localhost:3000/ > /dev/null; then echo "3000 is exposed"; exit 1; fi
          if (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null; then echo "27017 is exposed"; exit 1; fi

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Tear down
        if: always()
        run: docker compose down -v

  terraform:
    name: Terraform fmt, validate & plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for the read-only plan role
      pull-requests: write # post the plan on the PR
    defaults:
      run:
        working-directory: aws-infrastructure
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate (bootstrap)
        working-directory: aws-infrastructure/bootstrap
        run: terraform init -backend=false -input=false && terraform validate

      - name: terraform validate (app)
        run: terraform init -backend=false -input=false && terraform validate

      # Plan only on PRs from this repo (fork PRs get no AWS credentials); CD plans on its own
      - name: Configure AWS credentials (read-only plan role)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform plan
        id: plan
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          terraform init -input=false -reconfigure
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          # 0 = no changes, 2 = changes, anything else = error
          if [ "$code" = 1 ]; then exit 1; fi
          echo "changes=$([ "$code" = 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "### Terraform plan"
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            sed -n '/Terraform will perform\|No changes\|will no longer be managed/,$p' plan.txt | head -c 60000
            echo '```'
            echo '</details>'
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post plan on the PR
        if: steps.plan.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            const body = `${marker}\n${fs.readFileSync('aws-infrastructure/summary.md', 'utf8')}\n_Commit ${context.sha.slice(0, 7)} — infrastructure changes are applied by CD after merge, once approved in the \`production\` environment._`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
