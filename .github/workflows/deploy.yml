name: CD

# main → CI gates → Terraform plan → (approved) Terraform apply → read infra outputs
#      → build images → push to ECR → SSH deploy on EC2 → smoke tests & health checks
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for AWS
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}
  TF_VERSION: 1.16.5
  TF_DIR: aws-infrastructure

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: write # requested by the CI Terraform job (only used on PRs)

  infra-plan:
    name: Terraform plan
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (read-only plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform plan
        id: plan
        run: |
          terraform init -input=false
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          # 0 = no changes, 2 = changes, anything else = error
          if [ "$code" = 1 ]; then exit 1; fi
          echo "changes=$([ "$code" = 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "### Terraform plan"
            grep -E '^(Plan:|No changes)' plan.txt || true
            if [ "$code" = 2 ]; then
              echo
              echo "**Changes found — approve the \`production\` deployment to apply exactly this plan.**"
            fi
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            sed -n '/Terraform will perform\|No changes\|will no longer be managed/,$p' plan.txt | head -c 60000
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        if: steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 7

  infra-apply:
    name: Terraform apply (approval required)
    needs: infra-plan
    if: needs.infra-plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    # Required reviewers on this environment pause the job until someone approves
    environment: production
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      # Applies the reviewed plan file; fails if the state changed since it was made
      - name: terraform apply
        run: |
          terraform init -input=false
          terraform apply -input=false -no-color -lock-timeout=5m tfplan

  infra-outputs:
    name: Read infrastructure outputs
    needs: [infra-plan, infra-apply]
    # Runs when apply succeeded or was not needed; a rejected/failed apply stops the deploy
    if: ${{ !cancelled() && needs.infra-plan.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.infra-apply.result) }}
    runs-on: ubuntu-latest
    outputs:
      ec2_host: ${{ steps.out.outputs.ec2_host }}
      ecr_registry: ${{ steps.out.outputs.ecr_registry }}
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (read-only plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform output
        id: out
        run: |
          terraform init -input=false
          echo "ec2_host=$(terraform output -raw elastic_ip)" >> "$GITHUB_OUTPUT"
          echo "ecr_registry=$(terraform output -raw ecr_registry)" >> "$GITHUB_OUTPUT"

  build-push:
    name: Build & push ${{ matrix.service }}
    needs: infra-outputs
    if: ${{ !cancelled() && needs.infra-outputs.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [client, server]
    env:
      ECR_REGISTRY: ${{ needs.infra-outputs.outputs.ecr_registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          build-args: ${{ matrix.service == 'client' && 'API_URL=/api' || '' }}
          tags: |
            ${{ env.ECR_REGISTRY }}/mern-${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/mern-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to EC2
    needs: [infra-outputs, build-push]
    if: ${{ !cancelled() && needs.build-push.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ needs.infra-outputs.outputs.ec2_host }}
      ECR_REGISTRY: ${{ needs.infra-outputs.outputs.ecr_registry }}
    steps:
      - name: Set up SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Write production .env
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          umask 077
          cat > prod.env <<ENV
          ECR_REGISTRY=$ECR_REGISTRY
          IMAGE_TAG=$IMAGE_TAG
          CLIENT_URL=http://$EC2_HOST:8080
          CLIENT_PORT=8080
          MONGO_DB=mern_ecommerce
          JWT_SECRET=$JWT_SECRET
          ADMIN_EMAIL=$ADMIN_EMAIL
          ADMIN_PASSWORD=$ADMIN_PASSWORD
          ENV

      - name: Deploy over SSH
        run: |
          SSH="ssh -i ~/.ssh/deploy.pem ubuntu@$EC2_HOST"
          $SSH "cd ~/app && git fetch origin main && git reset --hard origin/main"
          scp -i ~/.ssh/deploy.pem prod.env ubuntu@$EC2_HOST:app/.env
          $SSH "cd ~/app && chmod 600 .env \
            && docker compose -f docker-compose.prod.yml pull \
            && docker compose -f docker-compose.prod.yml up -d --remove-orphans \
            && docker image prune -f"

      - name: Clean up secrets
        if: always()
        run: rm -f ~/.ssh/deploy.pem prod.env

  smoke-test:
    name: Smoke tests & health checks
    needs: [infra-outputs, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ needs.infra-outputs.outputs.ec2_host }}
    steps:
      - name: Wait for the API through nginx
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://$EC2_HOST:8080/api/category/list" > /dev/null; then
              echo "API is up"; exit 0
            fi
            echo "Attempt $i: not ready yet"; sleep 10
          done
          echo "API did not become healthy"; exit 1

      - name: Health reports this commit with the database connected
        run: |
          curl -fsS "http://$EC2_HOST:8080/api/health" | tee health.json
          jq -e --arg v "$IMAGE_TAG" '.status == "ok" and .database == "connected" and .version == $v' health.json

      - name: Frontend responds
        run: curl -fsS "http://$EC2_HOST:8080/" | grep -qi '<html'

      - name: Summary
        run: echo "### Live at http://$EC2_HOST:8080 (commit ${IMAGE_TAG::7})" >> "$GITHUB_STEP_SUMMARY"
