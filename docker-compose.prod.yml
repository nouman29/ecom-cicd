# Production (EC2): runs prebuilt images from ECR; nothing is built on the host.
# ECR_REGISTRY, IMAGE_TAG and the secrets below are written to .env by the deploy workflow.
services:
  client:
    image: ${ECR_REGISTRY:?ECR_REGISTRY must be set in .env}/mern-client:${IMAGE_TAG:-latest}
    container_name: client
    restart: unless-stopped
    ports:
      - '${CLIENT_PORT:-8080}:8080'
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-network

  server:
    image: ${ECR_REGISTRY:?ECR_REGISTRY must be set in .env}/mern-server:${IMAGE_TAG:-latest}
    container_name: server
    restart: unless-stopped
    environment:
      - PORT=3000
      - BASE_API_URL=api
      - CLIENT_URL=${CLIENT_URL:?CLIENT_URL must be set in .env}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - MONGO_URI=mongodb://mongo:27017/${MONGO_DB:-mern_ecommerce}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?ADMIN_EMAIL must be set in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      # Reported by /api/health so you can see which commit is deployed
      - APP_VERSION=${IMAGE_TAG:-latest}
    # Not published to the host: only reachable through the client's nginx proxy
    expose:
      - '3000'
    # Seed is idempotent (skips existing admin/categories/brands/products)
    command: ['sh', '-c', 'node utils/seed.js && npm start']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/category/list', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network

  mongo:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    command: mongod --quiet --logpath /dev/null
    # No host port: only the server reaches MongoDB over app-network
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
